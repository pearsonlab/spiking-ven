name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: Lint
        run: uv run --extra dev ruff check .

      # The core must import on numpy + scipy alone: no Brian2, no matplotlib.
      # Deliberately installed with NO extras, which is the thing being tested.
      - name: Core imports without optional extras
        run: uv run python -c "import spiking_ven; print(spiking_ven.__version__)"

      - name: Unit tests, core only (Brian2 tests should skip here)
        run: uv run --extra dev pytest -m "not slow" -q -rs

      - name: Unit tests with the Brian2 extra (Brian2 tests should run)
        run: uv run --extra brian2 --extra dev pytest -m "not slow" -q

  smoke-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      # Downloads the R469 corpus and builds motifs.npz. Both dataset hosts sit behind
      # CloudFront and 403 the default agent, which is why the downloader sets a browser
      # User-Agent itself rather than relying on a flag.
      - name: Prepare song corpus
        run: uv run --extra data sven-prep-data --data-dir data --out outputs/motifs.npz

      # Tiny encoder + a few renditions: exercises the whole chain in ~a minute without
      # running the full 10-minute reproduction.
      - name: Smoke train encoder + VEN
        run: make smoke
