[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spiking-ven"
dynamic = ["version"]   # read from src/spiking_ven/__init__.py; see [tool.hatch.version]
description = "Spiking sparse auditory encoder and vocal error network for the zebra finch song system"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "John Pearson" }]
keywords = ["neuroscience", "songbird", "sparse-coding", "spiking-neural-network", "zebra-finch"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# The network is simulated in Brian2; the encoder needs numpy and scipy. The ERB/gammatone
# filterbank is vendored (see THIRD_PARTY_NOTICES.md) rather than depended on, so there is
# no `gammatone` requirement. Brian2 compiles its code with Cython when a C compiler is
# available (much faster), and falls back to numpy otherwise.
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.15",
    "brian2>=2.8.0,<2.9",
    "cython>=3.0",
]

[project.optional-dependencies]
# Reading song WAVs during data preparation.
data = ["soundfile>=0.13"]
# Figure generation.
plots = ["matplotlib>=3.10"]
dev = ["pytest>=8", "ruff>=0.6", "ty"]

[project.urls]
Homepage = "https://github.com/pearsonlab/spiking-ven"
"Paper code" = "https://github.com/pearsonlab/vocal-error-network"

[project.scripts]
sven-prep-data = "spiking_ven.cli.prep_data:main"
sven-train-encoder = "spiking_ven.cli.train_encoder:main"
sven-train-ven = "spiking_ven.cli.train_ven:main"
sven-evaluate = "spiking_ven.cli.evaluate:main"
sven-figure = "spiking_ven.cli.figure:main"

[tool.hatch.version]
path = "src/spiking_ven/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spiking_ven"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full reproduction runs (minutes); deselect with -m 'not slow'"]

[tool.ruff]
line-length = 100
# filterbank.py is vendored verbatim from Gammatone 1.0.3 (see THIRD_PARTY_NOTICES.md).
# It is excluded from linting on purpose: reformatting vendored numerics would defeat
# the point of copying it byte-for-byte.
extend-exclude = ["src/spiking_ven/filterbank.py"]

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults, so a ruff upgrade cannot
# break CI or silently start rewriting ported research code. This is ruff's documented
# default set: pyflakes plus the essential pycodestyle errors.
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
# Scripts import their sibling ``sweep.py`` (via sys.path at run time).
extra-paths = ["scripts"]

[tool.ty.src]
# Type-checked in CI (blocking; see ci.yml). Same vendored exclusion as ruff:
# filterbank.py stays byte-for-byte with Gammatone 1.0.3.
exclude = ["src/spiking_ven/filterbank.py"]
